<script type="text/javascript">
    RED.nodes.registerType('ui-shutter', {
        category: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category'),
        color: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.colors.medium'),
        defaults: {
            name: { value: '' },
            group: { type: 'ui-group', required: true },
            order: { value: -1 },
            width: {
                value: 0,
                validate: function (v) {
                    const width = v || 0
                    const currentGroup = $('#node-input-group').val() || this.group
                    const groupNode = RED.nodes.node(currentGroup)
                    const valid = !groupNode || +width <= +groupNode.width
                    $('#node-input-size').toggleClass('input-error', !valid)
                    return valid
                }
            },
            height: { value: 0 },
            label: { value: '' },
            showLabel: { value: true },
            labelAlignment: { value: 'left' },
            shutterType: { value: 'shutter' },
            zeroMeans: { value: 'open' },
            showGraphic: { value: true },
            showButtons: { value: true },
            showSlider: { value: true },
            showPositionText: { value: true },
            textOpen: { value: 'Open' },
            textClosed: { value: 'Closed' },
            color: { value: '#607d8b' },
            skyColor: { value: '#bbdefb' },
            buttonColor: { value: '#607d8b' },
            buttonIconStyle: { value: 'arrow' },
            positionProperty: { value: 'payload' },
            slatProperty: { value: 'slats' },
            upValue: { value: 'false' },
            upValueType: { value: 'bool' },
            downValue: { value: 'true' },
            downValueType: { value: 'bool' },
            stopValue: { value: 'true' },
            stopValueType: { value: 'bool' },
            topic: { value: '' }
        },
        inputs: 1,
        outputs: 3,
        outputLabels: function (index) {
            const labels = this.shutterType === 'blind'
                ? ['up / down', 'stop', 'position', 'slats']
                : ['up / down', 'stop', 'position']
            return labels[index]
        },
        icon: 'font-awesome/fa-window-maximize',
        label: function () {
            return this.name || this.label || 'ui-shutter'
        },
        paletteLabel: 'shutter',
        oneditprepare: function () {
            // re-derive the output count on load too, not just on save - otherwise a
            // redeploy that never opens this node's edit dialog can silently truncate
            // an existing blind's 4th (slats) wire back down to 3 outputs
            this.outputs = this.shutterType === 'blind' ? 4 : 3

            $('#node-input-size').elementSizer({
                width: '#node-input-width',
                height: '#node-input-height',
                group: '#node-input-group'
            })

            $('#node-input-positionProperty').typedInput({
                type: 'msg',
                types: ['msg']
            })

            $('#node-input-slatProperty').typedInput({
                type: 'msg',
                types: ['msg']
            })

            $('#node-input-upValue').typedInput({
                default: 'bool',
                typeField: '#node-input-upValueType',
                types: ['str', 'num', 'bool', 'json']
            })

            $('#node-input-downValue').typedInput({
                default: 'bool',
                typeField: '#node-input-downValueType',
                types: ['str', 'num', 'bool', 'json']
            })

            $('#node-input-stopValue').typedInput({
                default: 'bool',
                typeField: '#node-input-stopValueType',
                types: ['str', 'num', 'bool', 'json']
            })

            function toggleBlindRows () {
                const isBlind = $('#node-input-shutterType').val() === 'blind'
                $('.node-row-blind-only').toggle(isBlind)
            }

            $('#node-input-shutterType').on('change', toggleBlindRows)
            toggleBlindRows()
        },
        oneditsave: function () {
            this.outputs = this.shutterType === 'blind' ? 4 : 3
        }
    })
</script>

<script type="text/markdown" data-help-name="ui-shutter">
# ui-shutter

A single Dashboard 2.0 widget combining up/stop/down buttons, a position slider,
an optional slat slider (venetian blinds) and an animated window graphic.

## Inputs

:position (any, number 0-100): merged into the node's stored state and shown on the widget.
:slats (any, number 0-100, blind only): merged into the node's stored state and shown on the widget.

The property names read from the input message are configurable (`positionProperty` / `slatProperty`,
default `payload` / `slats`). Position and slats may arrive in the same message or separately -
the node keeps the latest known value of each. Out-of-range numbers are clamped to 0-100; non-numeric
values are ignored with a warning.

## Outputs

1. **up/down** - sent when the up or down button is pressed. Payload is the configured "up" or "down" value, `msg.action` is `"up"` or `"down"`.
2. **stop** - sent when the stop button is pressed. Payload is the configured stop value, `msg.action` is `"stop"`.
3. **position** - sent once, on release, after dragging the position slider. Payload is a number 0-100, `msg.action` is `"position"`.
4. **slats** (blind only) - sent once, on release, after dragging the slat slider. Payload is a number 0-100, `msg.action` is `"slats"`.

All outputs carry `msg.topic` when a topic is configured.
