name: Publish Release
run-name: Manual publish (rescue)

# Manual-only rescue path. The normal path is the "publish" job inside
# Prepare release (.github/workflows/release-please.yaml): a tag push
# created by release-please-action's default GITHUB_TOKEN does not
# trigger other workflows (GitHub's anti-recursion rule), so a
# `push: tags` trigger here would never actually fire. Use this only
# to manually (re-)publish an existing tag/version, e.g. main's
# current package.json version, if the normal path ever fails.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish package to public npm registry
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-nr-catalogue:
    name: Update Node-RED Catalogue
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get package version
        id: getVersion
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Update Node-RED Catalogue
        uses: flowfuse/github-actions-workflows/actions/update-nr-flows@update-nr-flows/v1
        with:
          package: "@seaspotter/node-red-dashboard-2-ui-shutter"
          version: ${{ steps.getVersion.outputs.version }}
